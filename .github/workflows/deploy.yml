name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug & Replace API Key
        run: |
          echo "=== KIỂM TRA TRƯỚC KHI THAY THẾ ==="
          if grep -q "__OPENAI_API_KEY__" index.html; then
            echo "Đã tìm thấy placeholder __OPENAI_API_KEY__ trong index.html"
          else
            echo "CẢNH BÁO: Không tìm thấy chuỗi __OPENAI_API_KEY__ trong index.html! Hãy kiểm tra lại file."
          fi

          # Thực hiện thay thế API Key từ Secret
          sed -i "s|__OPENAI_API_KEY__|${{ secrets.OPENAI_API_KEY }}|g" index.html

          echo "=== KIỂM TRA SAU KHI THAY THẾ (Git Diff) ==="
          # Lệnh này sẽ hiển thị thay đổi trên file (GitHub tự động ẩn Secret bằng *** nên rất an toàn)
          git diff index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4